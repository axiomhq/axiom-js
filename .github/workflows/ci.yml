# caching pnpm deps: https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-data

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AXIOM_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
  AXIOM_URL: ${{ vars.TESTING_API_URL }}
  AXIOM_ORG_ID: ${{ vars.TESTING_ORG_ID }}
  NEXT_PUBLIC_AXIOM_TOKEN: ${{ secrets.TESTING_INGEST_API_TOKEN }}
  NEXT_PUBLIC_AXIOM_URL: ${{ vars.TESTING_API_URL }}
  NEXT_PUBLIC_AXIOM_ORG_ID: ${{ vars.TESTING_ORG_ID }}
  TESTING_ENVIRONMENT: ${{ vars.TESTING_ENVIRONMENT }}
  AXIOM_DATASET_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
  NODEVERSION: 22.x
  PNPM_VERSION: 10.4.1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 24.x
          - 26.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm build:cjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  preview-release:
    name: Preview release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20.x
          cache: 'pnpm'
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build --filter='./packages/*' && pnpm run build:cjs --filter='./packages/*'
      - run: pnpx pkg-pr-new publish --compact --pnpm './packages/*'

  check-winston-example:
    name: Check Winston example
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 24.x
          - 26.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm build:cjs
      - run: cd examples/winston && pnpm example

  test-integration:
    name: Test (Integration)
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: integration-${{ vars.TESTING_ENVIRONMENT || 'testing' }}
      cancel-in-progress: false
    continue-on-error: true
    strategy:
      fail-fast: true
      matrix:
        node:
          - 24.x
          - 26.x
    env:
      AXIOM_TOKEN: ${{ secrets.TESTING_API_TOKEN }}
      AXIOM_URL: ${{ vars.TESTING_API_URL }}
      AXIOM_ORG_ID: ${{ vars.TESTING_ORG_ID }}
      AXIOM_EDGE: ${{ vars.TESTING_EDGE }}
      AXIOM_EDGE_URL: ${{ vars.TESTING_EDGE_URL }}
      AXIOM_EDGE_DATASET_REGION: ${{ vars.TESTING_EDGE_DATASET_REGION }}
      AXIOM_DATASET_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node }}-${{ vars.TESTING_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Skip integration tests for external PRs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Skipping integration tests because this run does not have access to repository secrets."
      - name: Validate testing configuration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          missing=()
          for name in AXIOM_TOKEN AXIOM_URL AXIOM_ORG_ID TESTING_ENVIRONMENT; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required testing configuration: ${missing[*]}"
            exit 1
          fi
          echo "Testing configuration: org=${AXIOM_ORG_ID} url=${AXIOM_URL} environment=${TESTING_ENVIRONMENT}"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Cache turbo build setup
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm build && pnpm build:cjs
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm integration

  deploy-e2e-apps:
    name: Deploy E2E apps
    runs-on: ubuntu-latest
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }} # Required
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID}} #Required
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID}} #Required
          scope: ${{ secrets.VERCEL_SCOPE }}
          # The action only forwards env/build-env inputs in experimental API mode.
          # CLI flags also override stale project credentials during the Next.js build.
          vercel-args: >-
            --env "AXIOM_TOKEN=${{ secrets.TESTING_API_TOKEN }}"
            --env "AXIOM_URL=${{ vars.TESTING_API_URL }}"
            --env "AXIOM_ORG_ID=${{ vars.TESTING_ORG_ID }}"
            --env "NEXT_PUBLIC_AXIOM_TOKEN=${{ secrets.TESTING_INGEST_API_TOKEN }}"
            --env "NEXT_PUBLIC_AXIOM_URL=${{ vars.TESTING_API_URL }}"
            --env "NEXT_PUBLIC_AXIOM_ORG_ID=${{ vars.TESTING_ORG_ID }}"
            --env "AXIOM_DATASET_SUFFIX=${{ env.AXIOM_DATASET_SUFFIX }}"
            --build-env "AXIOM_TOKEN=${{ secrets.TESTING_API_TOKEN }}"
            --build-env "AXIOM_URL=${{ vars.TESTING_API_URL }}"
            --build-env "AXIOM_ORG_ID=${{ vars.TESTING_ORG_ID }}"
            --build-env "NEXT_PUBLIC_AXIOM_TOKEN=${{ secrets.TESTING_INGEST_API_TOKEN }}"
            --build-env "NEXT_PUBLIC_AXIOM_URL=${{ vars.TESTING_API_URL }}"
            --build-env "NEXT_PUBLIC_AXIOM_ORG_ID=${{ vars.TESTING_ORG_ID }}"
            --build-env "AXIOM_DATASET_SUFFIX=${{ env.AXIOM_DATASET_SUFFIX }}"
    outputs:
      preview-url: ${{ steps.vercel-deploy.outputs.preview-url }}
    environment:
      name: E2EPreview
      url: ${{ steps.vercel-deploy.outputs.preview-url }}

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs:
      - deploy-e2e-apps
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        node:
          - 24.x
          - 26.x
      max-parallel: 1
      fail-fast: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Cache turbo build setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm build:cjs # cjs build needed to run tests
      - name: Validate testing configuration
        shell: bash
        run: |
          missing=()
          for name in AXIOM_TOKEN NEXT_PUBLIC_AXIOM_TOKEN AXIOM_URL AXIOM_ORG_ID TESTING_ENVIRONMENT; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required testing configuration: ${missing[*]}"
            exit 1
          fi
          echo "Testing configuration: org=${AXIOM_ORG_ID} url=${AXIOM_URL} environment=${TESTING_ENVIRONMENT}"
      - env:
          TESTING_TARGET_URL: ${{ needs.deploy-e2e-apps.outputs.preview-url }}
        run: pnpm run e2e
